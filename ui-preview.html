<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>鈺通營造｜介面驗收預覽（假資料）</title><style>*{box-sizing:border-box}body{margin:0;font:14px "Microsoft JhengHei",sans-serif;background:#f4f1e9;color:#405d63}.layout{display:flex;min-height:100vh}aside{width:213px;flex-shrink:0;background:#405e64;color:white;padding:22px 10px}aside img{width:58px;display:block;margin:0 auto 18px}aside strong{display:block;text-align:center;margin-bottom:25px}nav button{width:100%;text-align:left;border:0;background:transparent;color:white;padding:12px 13px;border-radius:6px;cursor:pointer;margin:2px 0}nav button.active{background:#e9e7d9;color:#405d63;font-weight:bold}main{flex:1;min-width:0;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.tag{background:#fff3d4;color:#79551c;padding:7px 12px;border-radius:6px}.card{background:white;border:1px solid #d8ded8;border-radius:9px;padding:20px;margin-top:18px}h1{font-size:23px;margin:0}h2{font-size:17px;margin:0 0 16px}.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}input,select{padding:10px;border:1px solid #cbd9df;border-radius:7px;min-width:140px;background:white;color:#405d63}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid #e5e8e2;padding:13px;text-align:left}th{background:#f7f7f3}button.action{border:0;border-radius:5px;background:#405e64;color:white;padding:9px 14px;cursor:pointer}.muted{color:#7a8d90}.notice{background:#fff7e7;border-left:4px solid #d9a450;padding:12px 15px;margin-top:18px}.hidden{display:none}@media(max-width:650px){.layout{display:block}aside{width:100%;padding:12px}aside img,aside strong{display:none}nav{display:flex;overflow-x:auto}nav button{white-space:nowrap;width:auto}main{padding:12px}.card{overflow-x:auto}}</style></head><body><div class="layout"><aside><img src="./assets/yuhtong-logo-transparent.png" alt="鈺通營造 Logo"><strong>員工面談暨考績管理系統</strong><nav id="nav"></nav></aside><main><div class="top"><h1 id="heading">員工名冊</h1><span class="tag">介面驗收預覽｜僅假資料</span></div><div class="notice">此頁僅供檢查原有配色、選單與點選操作。無登入、無真實資料、無資料上傳及儲存；請勿輸入員工個資。</div><div class="card"><h2 id="subtitle">員工名冊</h2><div class="filters"><input id="search" placeholder="搜尋測試資料" aria-label="搜尋測試資料"><select id="dept"><option value="">全部部門</option><option>管理部</option><option>工務部</option></select><button class="action" id="reset">清除篩選</button></div><div id="content"></div></div></main></div><script>const tabs=["考績查詢","進度總覽","年度總覽","考績管理","員工表單","員工名冊","表單分配","紙本管理","期間與資格","人事權限","操作紀錄","使用協助","常見問題"];let active="員工名冊";const rows=[["測試甲","DEMO001","管理部","一般職員"],["測試乙","DEMO002","工務部","主管人員"],["測試丙","DEMO003","工務部","一般職員"]];const nav=document.querySelector("#nav"),content=document.querySelector("#content"),search=document.querySelector("#search"),dept=document.querySelector("#dept");function render(){nav.replaceChildren();tabs.forEach(t=>{const b=document.createElement("button");b.textContent=t;b.className=t===active?"active":"";b.onclick=()=>{active=t;search.value="";dept.value="";render()};nav.append(b)});document.querySelector("#heading").textContent=active;document.querySelector("#subtitle").textContent=active;if(active==="員工名冊"||active==="表單分配"){const table=document.createElement("table");const head=document.createElement("thead");const tr=document.createElement("tr");["員工姓名","員工編號","部門","表單類型"].forEach(x=>{const th=document.createElement("th");th.textContent=x;tr.append(th)});head.append(tr);table.append(head);const body=document.createElement("tbody");rows.filter(r=>(!dept.value||r[2]===dept.value)&&r.join(" ").includes(search.value.trim())).forEach(r=>{const tr=document.createElement("tr");r.forEach(v=>{const td=document.createElement("td");td.textContent=v;tr.append(td)});body.append(tr)});table.append(body);content.replaceChildren(table)}else{const p=document.createElement("p");p.className="muted";p.textContent=active+"：版面與選單切換預覽，正式資料及功能尚未連線。";content.replaceChildren(p)}}search.addEventListener("input",render);dept.addEventListener("change",render);document.querySelector("#reset").onclick=()=>{search.value="";dept.value="";render()};render();</script></body></html>
