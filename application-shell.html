" id=\"emailAdminEnable\">恢復所選管理員\u003c/button>\u003cp id=\"emailAdminResult\" role=\"status\">\u003c/p>\u003cp>忘記密碼：由另一位最高人事使用原「員工登入管理」重設；遺失信箱：先停用，當面核實後由另一位最高人事重新綁定。兩位最高人事皆無法登入時須由原 Google 專案擁有者介入，不提供公開繞過驗證的入口。\u003c/p>';host.append(section);window.HRGoogleBackupMount?.(host);const target=section.querySelector('#emailAdminTarget'),out=section.querySelector('#emailAdminResult');let accounts=[];async function load(){accounts=(await api('accounts')).accounts;target.replaceChildren();for(const a of accounts.filter(a=>a.employeeId!==context.ownEmployeeId)){const o=document.createElement('option');o.value=a.employeeId;o.textContent=a.name+'／'+(a.role==='super'?'最高人事':'一般人事')+'／'+(a.disabled?'已停用':a.emailVerified?'已綁定':'未綁定');target.append(o)}}function selected(){const a=accounts.find(a=>a.employeeId===target.value);if(!a)throw Error('請先選擇其他管理員');return a}async function run(fn){try{await fn()}catch(e){out.textContent=e.message}}section.querySelector('#emailAdminRefresh').onclick=()=>run(load);section.querySelector('#emailAdminBind').onclick=()=>run(async()=>{const a=selected(),email=section.querySelector('#emailAdminAddress').value;if(!confirm('確認已核實此管理員及信箱？開始後會撤銷其舊登入。'))return;await api('binding-start',{employeeId:a.employeeId,email,expectedVersion:a.emailVersion,operationId:crypto.randomUUID()});section.querySelector('#emailAdminAddress').value='';const code=prompt('請由新信箱持有人當面確認，輸入此次「信箱綁定」郵件的 6 位數代碼；請勿使用登入驗證碼。');if(!code){out.textContent='綁定尚未完成，對方舊登入已撤銷。';return}await api('binding-finish',{employeeId:a.employeeId,code,operationId:crypto.randomUUID()});out.textContent='新信箱已確認，舊登入已撤銷；密碼維持原設定。';await load()});for(const [id,disabled]of [['emailAdminDisable',true],['emailAdminEnable',false]])section.querySelector('#'+id).onclick=()=>run(async()=>{const a=selected();if(!confirm('確認'+(disabled?'停用':'恢復')+a.name+'？'))return;await api('account',{employeeId:a.employeeId,disabled,expectedEpoch:a.epoch,operationId:crypto.randomUUID()});out.textContent='帳號狀態已更新，舊登入已失效。';await load()});run(load)}document.addEventListener('management-route-ready',e=>{if(e.detail?.page==='permissions')mount()});new MutationObserver(mount).observe(document.documentElement,{childList:true,subtree:true});mount()})();\n","login.js":"'use strict';\n(()=>{\n const form=document.getElementById('employeeLogin');if(!form)return;\n if(!document.getElementById('hrLoginBusyStyle')){const style=document.createElement('style');style.id='hrLoginBusyStyle';style.textContent='#loginStatus{min-height:1.6em;margin:12px 0 0}#employeeLogin + a{display:block;margin-top:14px;line-height:1.6}'+'#employeeLogin button.hr-login-busy{display:inline-flex;align-items:center;justify-content:center;gap:.5em;cursor:progress}#employeeLogin .hr-login-spinner{display:inline-block;flex:none;width:1em;height:1em;box-sizing:border-box;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:hr-login-spin .8s linear infinite}@keyframes hr-login-spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){#employeeLogin .hr-login-spinner{animation:none;border-right-color:currentColor;opacity:.6}}';document.head.append(style);}\n let inFlight=false;\n form.onsubmit=async e=>{e.preventDefault();if(inFlight)return;inFlight=true;const button=form.querySelector('button[type=submit]'),status=document.getElementById('loginStatus'),original=button?[...button.childNodes]:[];let navigating=false;if(button){const spinner=document.createElement('span');spinner.className='hr-login-spinner';spinner.setAttribute('aria-hidden','true');button.disabled=true;button.setAttribute('aria-busy','true');button.classList.add('hr-login-busy');button.replaceChildren(spinner,document.createTextNode('登入中…'));}form.setAttribute('aria-busy','true');status.textContent='';try{const r=await fetch('/api/portal/login',{method:'POST',body:JSON.stringify({name:document.getElementById('lookupName').value,password:document.getElementById('lookupPassword').value})});let d;try{d=await r.json()}catch{throw Error('登入服務回應異常，請稍後再試；不必重新設定密碼。')}if(!r.ok)throw Error(r.status===429?'登入嘗試暫時受限，請停止重試，等待約15分鐘後再試。（429）':r.status===401?'無法登入，請確認姓名及密碼。（401）':r.status>=500?'系統暫時無法完成登入，請稍後再試。（'+r.status+'）':'登入請求未完成，請回報錯誤代碼。（'+r.status+'）');HRGoogleNavigate(d.mfaRequired?'/local/factor.html':'/prototype/integrated-demo.html?entry=portal');navigating=true}catch(error){status.textContent=error.message}finally{document.getElementById('lookupPassword').value='';if(!navigating){if(button){button.replaceChildren(...original);button.classList.remove('hr-login-busy');button.removeAttribute('aria-busy');button.disabled=false;}form.removeAttribute('aria-busy');inFlight=false;}}};\n})();\n","offline/credentials-ui.js":"'use strict';\n(()=>{let mounted=false;async function request(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{}),data=await r.json();if(!r.ok)throw Error(data.error);return data}\nfunction mount(){const context=window.HRPortalContext,host=document.getElementById('page-employees'),editor=document.getElementById('rosterEditor'),id=document.getElementById('rosterId');if(mounted||!host||!editor||editor.hidden||!id?.readOnly||!id.value||!context||context.role==='employee'||!context.permissions.includes('credentialManage'))return;mounted=true;const section=document.createElement('section');section.className='admin-section';section.id='employeeCredentialPanel';section.innerHTML='\u003ch3>登入帳號管理\u003c/h3>\u003cp>不顯示既有密碼。新密碼 4～20 個字元；員工帳號與密碼由最高人事統一設定與重設，員工不需也不能自行更改；人事帳號被重設後須自行更改。系統不會顯示或寄出密碼。\u003c/p>\u003cbutton type=\"button\" id=\"reloadCredentials\">重新讀取帳號\u003c/button>\u003clabel for=\"credentialEmployee\">員工\u003c/label>\u003cselect id=\"credentialEmployee\">\u003c/select>\u003clabel for=\"credentialName\">登入姓名\u003c/label>\u003cinput id=\"credentialName\" maxlength=\"80\" autocomplete=\"off\">\u003clabel for=\"credentialPassword\">設定新密碼\u003c/label>\u003cinput id=\"credentialPassword\" type=\"password\" minlength=\"4\" maxlength=\"20\" autocomplete=\"off\">\u003cdiv class=\"toolbar\">\u003cbutton type=\"button\" id=\"credentialStepUp\" hidden>操作前寄送 Email 碼\u003c/button>\u003cbutton type=\"button\" id=\"credentialSave\">設定／重設密碼\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"credentialToggle\">停用／啟用登入\u003c/button>\u003c/div>\u003cp id=\"credentialState\">\u003c/p>\u003cp id=\"credentialMessage\" role=\"status\">\u003c/p>\u003cp class=\"muted\">敏感操作需輸入個人信箱的確認碼。一般人事不能重設密碼。\u003c/p>';editor.after(section);const $=id=>document.getElementById(id);let rows=[],activeEmployee='',generation=0;const selectedId=()=>!editor.hidden&&id.readOnly?id.value:'';function current(){return rows.find(e=>e.employeeId===$('credentialEmployee').value&&e.employeeId===selectedId())}function show(){const row=current();if(!row)return;$('credentialName').value=row.loginName;$('credentialPassword').value='';$('credentialState').textContent=row.hasPassword?(row.enabled?'已設定密碼／可登入':'已停用登入'):'尚未設定密碼；不能登入'}async function load(){const employeeId=selectedId(),request=++generation;rows=[];$('credentialName').value='';$('credentialPassword').value='';$('credentialEmployee').replaceChildren();if(!employeeId)return;const result=await fetch('/api/offline/credentials?employeeId='+encodeURIComponent(employeeId));const data=await result.json();if(request!==generation||employeeId!==selectedId())return;if(!result.ok)throw Error(data.error||'帳號資料無法讀取，請稍後重試。');rows=data.accounts.filter(e=>e.employeeId===employeeId);$('credentialEmployee').replaceChildren(...rows.map(e=>new Option(e.employeeName+' · '+e.employeeId,e.employeeId)));$('credentialEmployee').hidden=true;document.querySelector('label[for=credentialEmployee]').hidden=true;show()}window.HRCredentialSync=()=>{const selected=selectedId();section.hidden=!selected;$('credentialPassword').value='';if(selected!==activeEmployee){activeEmployee=selected;load().catch(e=>$('credentialMessage').textContent=e.message)}};$('credentialEmployee').onchange=show;$('reloadCredentials').onclick=()=>load().catch(e=>$('credentialMessage').textContent=e.message);$('credentialStepUp').onclick=async()=>{try{if(!await window.HRUI.confirm('操作確認碼將寄至您的個人信箱。'))return;await request('/api/portal/reauth',{confirmation:'MOCK-REAUTH'});$('credentialMessage').textContent='請繼續選擇操作；系統將寄送綁定該次操作的 Email 碼。'}catch(e){$('credentialMessage').textContent=e.message}};\nfor(const [id,path]of [['credentialSave','/api/offline/password'],['credentialToggle','/api/offline/enabled']])$(id).onclick=async()=>{const row=current(),button=$(id);if(!row)return;button.disabled=true;try{if(!await window.HRUI.confirm('確認調整 '+row.employeeName+' 的登入資料？既有登入工作階段將失效。'))return;const body={employeeId:row.employeeId,expectedVersion:row.version};if(id==='credentialSave'){body.loginName=$('credentialName').value;body.newPassword=$('credentialPassword').value}else body.enabled=!row.enabled;const result=await request(path,body);await load();const n=result&&result.notification;$('credentialMessage').textContent='登入資料已更新，舊工作階段已撤銷。'+(id==='credentialSave'?(n&&n.status==='sent'?'已寄通知信給本人（不含密碼）。':n&&n.status==='send-failed'?'通知信寄送失敗，請當面或以電話通知本人，並請對方登入後改密碼。':'此帳號沒有已驗證的 Email，系統無法通知；請由您當面或以電話告知帳號與密碼，不要用訊息軟體傳送；員工不需自行更改密碼，人事帳號登入後須自行更改。'):'')}catch(e){$('credentialMessage').textContent=e.message}finally{$('credentialPassword').value='';button.disabled=false}};window.HRCredentialSync()}\nfunction permission(){const host=document.getElementById('portalPermissions');if(!host||host.querySelector('[data-permission=credentialManage]'))return;const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.value='credentialManage';box.dataset.permission='credentialManage';label.append(box,document.createTextNode('登入帳號管理（需同時授予員工維護）'));host.append(label);const sync=async()=>{try{const m=window.HRGrantSnapshot?window.HRGrantSnapshot():window.HRGrantDataPromise?(await window.HRGrantDataPromise).management:await request('/api/portal/management'),id=document.getElementById('portalTarget').value;box.checked=!!m.accounts.find(a=>a.id===id)?.permissions.includes('credentialManage')}catch{box.checked=false}};document.getElementById('portalTarget')?.addEventListener('change',sync);sync()}document.addEventListener('roster-editor-state',()=>{mount();window.HRCredentialSync?.()});const observer=new MutationObserver(()=>{mount();permission()});observer.observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['data-portal-ready']});mount();permission()})();\n","password-eye.js":"'use strict';\n// Show / hide toggle (eye) for every password input, including inputs created later (dialogs, admin panels).\n// Display only: it changes input.type between \"password\" and \"text\". It never reads, stores, sends or logs the value,\n// and does not touch any login rule, password rule or permission logic.\n(() => {\n  if (window.HRPasswordEyeInstalled) return;\n  window.HRPasswordEyeInstalled = true;\n\n  const WRAP = 'pw-eye-wrap', INPUT = 'pw-eye-input', BTN = 'pw-eye-btn', DONE = 'data-pw-eye';\n  const LABEL_SHOW = '顯示密碼', LABEL_HIDE = '隱藏密碼';\n  const ICON_SHOW = '\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M1.5 12S5.5 5 12 5s10.5 7 10.5 7-4 7-10.5 7S1.5 12 1.5 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"3.2\"/>\u003c/svg>';\n  const ICON_HIDE = '\u003csvg viewBox=\"0 0 24 24\" width=\"22\" height=\"22\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" focusable=\"false\">\u003cpath d=\"M3 3l18 18\"/>\u003cpath d=\"M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10.5 7 10.5 7a17.6 17.6 0 0 1-3.2 4\"/>\u003cpath d=\"M6.6 6.7C3.6 8.5 1.5 12 1.5 12S5.5 19 12 19c1.6 0 3-.4 4.3-1\"/>\u003cpath d=\"M9.9 9.9a3.2 3.2 0 0 0 4.2 4.2\"/>\u003c/svg>'; ant;border-bottom:1px solid var(--line)!important}\n.admin-nav button{background:#f2f6f7!important;color:#31535b!important;border:1px solid #dbe8e9!important;border-radius:10px!important}\n.admin-nav button.active{background:#dcefeb!important;color:#075d55!important;outline:2px solid #9dcfc5!important}\n.admin-nav button:hover{background:#e6f2f0!important}\n.period-preview{border-color:#c9dfe0;background:#f4faf9}\n.rubric{border-color:#dce7e9;border-radius:12px;background:#fff}\n.rubric-head input,.rubric-head select{border-color:#c58b32;background:#fff9eb}\n.score-focus{background:#fff3d8;color:#845514}\n@media(max-width:720px){.site-header{align-items:flex-start;flex-direction:column}.admin-nav{padding:12px!important}}\n\n\n.employee-footer{display:flex;justify-content:center;padding:26px 12px 12px;border-top:1px solid #dbe6e9;margin-top:28px}.employee-footer .admin-entry{background:transparent!important;border:0!important;color:#72848b!important;font-size:12px!important;font-weight:500;padding:7px 10px}.employee-footer .admin-entry:hover{color:#174b59!important;text-decoration:underline;background:transparent!important}\n\n/* Keep HR title and all six tabs visible while scrolling the admin shell */\n.admin-top{position:sticky!important;top:0!important;z-index:12!important;background:#fff!important}.admin-nav{position:sticky!important;top:58px!important;z-index:11!important;background:#fff!important;box-shadow:0 3px 10px rgba(20,55,62,.06)}#adminDemo{display:contents}#adminDemo[hidden]{display:none!important}.admin-frame{height:calc(100vh - 180px)!important;min-height:500px;overflow:auto}@media(max-width:700px){.admin-nav{top:58px!important;overflow-x:auto;flex-wrap:nowrap!important}.admin-nav button{white-space:nowrap}.admin-nav .hint{display:none}.admin-frame{height:calc(100vh - 160px)!important;min-height:350px}}\n\n/* Login preview is intentionally disabled until server-side authentication exists */\n.login-preview{padding:15px 0 8px}.login-preview label{margi int\">正式版輸入姓名後才由後端查詢；同名需再核對，不向瀏覽器提供整份名單。\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>二、員工面談\u003c/h2>\u003cdiv id=\"interview\">\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>三、工作成果\u003c/h2>\u003cp class=\"hint\">依 Word 原表格逐項填寫，共 4 項。成果可說明進度、品質、效率、成本節省、風險控管、流程改善或其他具體貢獻。\u003c/p>\u003cdiv id=\"projectRows\">\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>四、考績自評\u003c/h2>\u003cp class=\"hint\">依所選類別顯示原始 Word 的八項考核標準、評語及分數。\u003c/p>\u003cdiv class=\"score-focus\">★ 請注意：每題「自評分數」請填在橘黃色欄位\u003c/div>\u003cdiv id=\"scores\">\u003c/div>\u003cp id=\"scoreProgress\" class=\"hint\">已完成 0／8 題\u003c/p>\u003cp>系統自動加總：\u003coutput id=\"sum\">0\u003c/output> 分\u003c/p>\u003clabel>\u003cinput id=\"override\" type=\"checkbox\" style=\"width:auto\"> 人工調整總分\u003c/label>\u003cdiv id=\"manualBox\" hidden>\u003clabel for=\"manual\">調整後分數\u003c/label>\u003cinput id=\"manual\" type=\"number\" min=\"0\" step=\"0.5\">\u003clabel for=\"reason\">調整原因\u003c/label>\u003ctextarea id=\"reason\">\u003c/textarea>\u003c/div>\u003cp>採用總分：\u003coutput id=\"effective\">0\u003c/output> 分\u003c/p>\u003cp id=\"scoreCompletion\" class=\"hint\">自評尚未完成\u003c/p>\u003cdiv id=\"submissionReceipt\" class=\"submission-receipt\" role=\"status\">\u003c/div>\u003cp class=\"hint\" id=\"confirmationMeaning\">\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003cdiv class=\"actions\">\u003cbutton id=\"save\" type=\"button\">暫存草稿\u003c/button>\u003cbutton id=\"resume\" class=\"secondary\" type=\"button\">恢復已存草稿\u003c/button>\u003cbutton id=\"reset\" class=\"secondary\" type=\"button\">清除本機草稿\u003c/button>\u003cbutton id=\"check\" class=\"secondary\" type=\"button\">檢查填寫完整性\u003c/button>\u003cbutton id=\"submit\" class=\"secondary\" type=\"button\" disabled>正式送出（尚未開放）\u003c/button>\u003c/div>\u003cp id=\"checkStatus\" role=\"status\">\u003c/p>\u003cp id=\"draftInfo\" class=\"hint\">尚無暫存紀錄\u003c/p>\u003cp id=\"status\" class=\"hint\" role=\"status\">\u003c/p>\u003c/section>\n\u003cfooter class=\"employee-footer\">\u003cbutton type=\"button\" class=\"admin-entry\" id=\"openAdmin\">管理後台入口\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cdiv id=\"adminShell\" class=\"admin-shell\" hidden>\n\u003cdiv class=\"admin-top\">\u003cstrong>鈺通營造｜人事管理後台\u003c/strong>\u003cbutton type=\"button\" class=\"secondary\" id=\"exitAdmin\">← 返回員工填寫頁\u003c/button>\u003c/div>\n\u003cdiv id=\"adminLogin\" class=\"admin-login\">\u003ch2>人事後台入口\u003c/h2>\u003cp class=\"warning\">\u003c/p>\u003cp class=\"hint\">依目前公司 POP/SMTP Outlook 信箱環境，先預覽「公司信箱＋一次性驗證碼」登入流程；正式寄信與驗證服務尚未建立。\u003c/p>\u003cdiv class=\"login-preview\" aria-label=\"公司信箱一次性驗證碼登入流程預覽\">\u003clabel for=\"previewAdminEmail\">公司 Outlook 信箱\u003c/label>\u003cinput id=\"previewAdminEmail\" type=\"email\" placeholder=\"正式版啟用後填寫\" disabled autocomplete=\"off\">\u003cbutton type=\"button\" disabled title=\"尚未串接寄信與身分驗證服務\">寄送一次性驗證碼（尚未啟用）\u003c/button>\u003clabel for=\"previewAdminCode\">電子郵件驗證碼\u003c/label>\u003cinput id=\"previewAdminCode\" inputmode=\"numeric\" type=\"text\" placeholder=\"正式版啟用後填寫\" disabled autocomplete=\"off\">\u003cbutton type=\"button\" disabled title=\"尚未建立伺服端驗證與權限檢查\">驗證並登入（尚未啟用）\u003c/button>\u003cp class=\"hint\">正式版規劃：驗證碼限時、限次數且僅能使用一次；驗證通過後，系統仍會檢查是否為已授權的人事帳號。此頁目前不寄信、不驗證，也不收集任何帳號資料。\u003c/p>\u003c/div>\u003cbutton type=\"button\" id=\"enterDemoAdmin\">進入人事後台\u003c/button>\u003c/div>\n\u003cdiv id=\"adminDemo\" hidden>\u003cnav class=\"admin-nav\" aria-label=\"人事後台功能\">\u003cbutton type=\"button\" class=\"secondary\" id=\"showEmployees\">員工資料管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showAccounts\">帳號與權限管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showReviews\">考績年度／資料查詢\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showMultiSite\">多工地評核管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showAcceptance\">人事流程試行\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showMaintenance\">系統維護中心\u003c/button>\u003cspan class=\"hint\">正式收件、Word 下載及後端權限：尚未串接\u003c/span>\u003c/nav>\u003ciframe id=\"adminFrame\" class=\"admin-frame\" title=\"人事後台功能頁面\" loading=\"lazy\">\u003c/iframe>\u003c/div>\n\u003c/div>\n\u003cscript src=\"inline-employee-self-review-1.js\">\u003c/script>\n\u003c!-- Original form preserved verbatim above; mock workflow is an additive adapter. -->\n\u003cscript src=\"original-form-schema.js\">\u003c/script>\n\u003cscript src=\"integrated-demo.js\">\u003c/script>\n\u003cscript src=\"original-form-workflow.js\">\u003c/script>\n\u003cscript src=\"/employee-interview-system/offline/credentials-ui.js\">\u003c/script>\u003cscript src=\"/employee-interview-system/local/management.js\">\u003c/script>\u003c/body>\u003c/html>\n","prototype/faq-ui.js":"'use strict';\nwindow.HRFaq={async mount(page){\n const response=await fetch('/api/faq');if(!response.ok)throw Error('無法載入人事常見問題');const data=await response.json(),node=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};\n const note=node('p','沿用原人事維護中心內容；其中正式密碼、復原與備份功能尚未實作，不代表已啟用。');note.className='configuration-notice';page.append(note);const tools=document.createElement('div');tools.className='toolbar';tools.innerHTML='\u003clabel for=\"faqSearch\">搜尋問題／答案\u003c/label>\u003cinput id=\"faqSearch\">\u003clabel for=\"faqCategory\">分類\u003c/label>\u003cselect id=\"faqCategory\">\u003coption value=\"\">全部問題\u003c/option>\u003coption value=\"account\">登入與帳號\u003c/option>\u003coption value=\"form\">填寫與期別\u003c/option>\u003coption value=\"data\">資料與連線\u003c/option>\u003c/select>\u003cbutton type=\"button\" id=\"printFaq\" class=\"secondary\">列印維護操作說明\u003c/button>';page.append(tools);const list=document.createElement('div');list.id='faqList';page.append(list);const category=id=>['login','password','recovery'].includes(id)?'account':['submit','period'].includes(id)?'form':'data';\n for(const item of data.items){const d=document.createElement('details');d.className='faq-item';d.dataset.category=category(item.id);d.dataset.faq=item.id;d.append(node('summary',item.question));const ol=document.createElement('ol');for(const step of item.steps)ol.append(node('li',step));d.append(ol);list.append(d)}const count=node('p','');count.id='faqCount';page.append(count);function filter(){const text=document.getElementById('faqSearch').value.trim(),type=document.getElementById('faqCategory').value;for(const d of list.children)d.hidden=!!(text&&!d.textContent.includes(text)||type&&d.dataset.category!==type);count.textContent='共 '+[...list.children].filter(d=>!d.hidden).length+' 個問題'}document.getElementById('faqSearch').oninput=e=>{if(!e.isComposing)filter()};document.getElementById('faqSearch').addEventListener('compositionend',filter);document.getElementById('faqCategory').onchange=filter;document.getElementById('printFaq').onclick=()=>window.print();filter();page.dataset.faqSource=data.sourceCommit;\n const maintenance=document.createElement('details');maintenance.className='faq-item';maintenance.append(node('summary','原維護中心狀態說明（尚未串接）'));for(const text of ['Google 試算表連線：尚未串接','Apps Script 服務：尚未串接','最近資料備份：尚未串接','資料寫入異常：尚未串接','自行修改密碼：待建立驗證','忘記密碼信箱重設：待建立驗證','另一位最高管理員解鎖：待建立權限','備份與還原：待建立權限','正式版會記錄登入失敗、解鎖、密碼重設、權限變更、資料更正及備份操作，並限制只有具備適當權限的人員可以查閱。'])maintenance.append(node('p',text));page.append(maintenance);\n}};\n","prototype/grant-management.js":"'use strict';\nwindow.HRGrantMount=()=>window.HRGrantReady||(window.HRGrantReady=(async()=>{const grantData=request('/api/portal/grant-data');window.HRGrantDataPromise=grantData;\n const $=id=>document.getElementById(id),panel=document.createElement('section');panel.id='portalManagement';panel.className='admin-section';document.getElementById('workflowHr').append(panel);\n panel.innerHTML=`\u003ch3>人事權限\u003c/h3>\u003cp class=\"muted\">保留既有範圍；變更須預覽並完成 Email 再次確認。\u003c/p>\u003cdiv class=\"grant-columns\">\u003csection>\u003ch4>功能權限\u003c/h4>\u003clabel for=\"portalTarget\">一般人事帳號\u003c/label>\u003cselect id=\"portalTarget\">\u003c/select>\u003cdiv id=\"portalPermissions\" class=\"permission-checks\">\u003c/div>\u003c/section>\u003csection>\u003ch4>資料管理範圍\u003c/h4>\u003clabel for=\"grantEmployeeMode\">員工範圍\u003c/label>\u003cselect id=\"grantEmployeeMode\">\u003coption value=\"existing\">保留既有授權範圍\u003c/option>\u003coption value=\"all\">全部員工（含後續新增）\u003c/option>\u003coption value=\"departments\">指定部門\u003c/option>\u003coption value=\"employees\">指定員工\u003c/option>\u003c/select>\u003cbutton type=\"button\" class=\"secondary\" id=\"newGrantPlan\">建立新的範圍設定\u003c/button>\u003cdiv id=\"grantDepartmentArea\" hidden>\u003clabel>選擇部門\u003c/label>\u003cdiv id=\"grantDepartments\" class=\"permission-checks\">\u003c/div>\u003c/div>\u003cdiv id=\"grantEmployeeArea\" hidden>\u003clabel for=\"grantEmployeeSearch\">搜尋指定員工\u003c/label>\u003cinput id=\"grantEmployeeSearch\">\u003cdiv id=\"portalScopeEmployee\" class=\"permission-checks scope-checks\">\u003c/div>\u003c/div>\u003clabel for=\"grantPeriodMode\">考績期別\u003c/label>\u003cselect id=\"grantPeriodMode\">\u003coption value=\"existing\">保留既有期別限制\u003c/option>\u003coption value=\"all\">全部期別（含後續新增）\u003c/option>\u003coption value=\"selected\">指定期別\u003c/option>\u003c/select>\u003cdiv id=\"portalScopePeriod\" class=\"permission-checks\" hidden>\u003c/div>\u003cp id=\"existingGrantSummary\" class=\"muted\">\u003c/p>\u003c/section>\u003c/div>\u003cdiv class=\"toolbar\">\u003cbutton type=\"button\" id=\"portalPreviewGrants\" class=\"secondary\">預覽授權變更\u003c/button>\u003cbutton type=\"button\" id=\"portalReauth\">人事驗證器再次確認\u003c/button>\u003cbutton type=\"button\" id=\"portalSaveGrants\" disabled>確認儲存權限\u003c/button>\u003c/div>\u003cp id=\"grantPreview\" role=\"status\">\u003c/p>\u003cp id=\"portalGrantStatus\" role=\"status\">\u003c/p>`;\n async function request(url,body){const r=await fetch(url,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.o 良好。\", \"對管理不太關心，組織內士氣稍差，部屬有違規現象。\", \"管理懈怠、引起部屬不滿，組織散漫、士氣低落、規律差。\"], \"levels\": [[18.0, 19.0, 20.0], [15.0, 16.0, 17.0], [12.0, 13.0, 14.0], [9.0, 10.0, 11.0], [6.0, 7.0, 8.0]]}, {\"name\": \"業務處理成果\", \"sourceName\": \"業理務成處果\", \"desc\": \"指所完成業務工作成果的正確性與可靠性之程度。\", \"criteria\": [\"實事求是，適切適時行事且能貫徹到底，成果極佳，能充分信賴。\", \"工作細心，適時行事，成果正確，堪能信賴。\", \"工作細心且能在預定時間內完成，成果尚稱良好。\", \"工作不夠細心，常有錯誤，成果稍差，須加催促。\", \"工作能力極弱，成果差，浪費多，須嚴加督導。\"], \"levels\": [[13.0, 14.0, 15.0], [10.0, 11.0, 12.0], [7.0, 8.0, 9.0], [5.5, 6.0, 6.5], [4.0, 4.5, 5.0]]}, {\"name\": \"革新改進績效\", \"sourceName\": \"革進新績改效\", \"desc\": \"指為達成工作目標或解決工作問題所做創造、思考及革新之績效程度。\", \"criteria\": [\"具有敏感的問題意識，積極謀求革新，著有成效。\", \"自動改進工作方法或提出建議，力求革新、提高效率，成效良好。\", \"能擬定工作改善方法或提出建議，成效普通。\", \"問題意識稍差，份內工作少有改進。\", \"滿足現狀、不謀改進、工作效率差。\"], \"levels\": [[13.0, 14.0, 15.0], [10.0, 11.0, 12.0], [7.0, 8.0, 9.0], [5.5, 6.0, 6.5], [4.0, 4.5, 5.0]]}, {\"name\": \"接洽表現情形\", \"sourceName\": \"接現洽情表形\", \"desc\": \"指內外接洽或商討事項所表現才能及風度。\", \"criteria\": [\"任何場合皆能貫徹正確主張，令人感服，圓滿達成目的。\", \"任何商討或接洽，都有正確主張，能達成目的。\", \"接拾或商討能力及風度均為一般水準，尚能達成目的。\", \"無主見亦不主張，接洽能力不足，需要他人協助。\", \"對答技巧差，態度欠溫和，給對方留不好的印象。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"盡責努力程度\", \"sourceName\": \"\\\\盡力責程努度\", \"desc\": \"指完成業務職掌及承上啟下之努力程度。\", \"criteria\": [\"有強烈責任感，認真執行業務，任勞任怨完成工作。\", \"富有責任感，認識本身職責，認真執行業務。\", \"有責任感，執行業務努力程度尚稱良好。\", \"責任感稍差，時常有逃避責任的傾向。\", \"無責任感，常虛報或逃避責任，轉達命令不夠徹底。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"知識與技能\", \"sourceName\": \"知識技與能\", \"desc\": \"指完成職務所必需的基本知識、專門知識及對經營狀況的認識程度。\", \"criteria\": [\"有極豐富的學識及技能，瞭解經營狀況，能充分發揮圓滿完成。\", \"有豐富的學識和技能，瞭解經營狀況，足夠完成本身工作。\", \"知識和技能均為一般水準，尚能完成本身工作。\", \"知識和技能稍感不足，執行職務需詳細提示。\", \"知識和技能均不足，影響日常工作之進行。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"操行與品德\", \"sourceName\": \"操行品與德\", \"desc\": \"指習慣、規矩、誠實、 createElement('div');head.className='rubric-head';const label=document.createElement('label');label.htmlFor='score'+i;label.textContent=r.name+'｜自評分數';const input=document.createElement('select');input.id='score'+i;const blank=document.createElement('option');blank.value='';blank.textContent='請選擇分數';input.append(blank);[...new Set(r.levels.flat())].sort((a,b)=>a-b).forEach(n=>{const opt=document.createElement('option');opt.value=String(n);opt.textContent=n+' 分';input.append(opt)});const error=document.createElement('span');error.className='score-error';error.id='scoreError'+i;error.hidden=true;head.append(label,error,input);box.append(head);const desc=document.createElement('p');desc.className='rubric-desc';desc.textContent=r.desc;box.append(desc);const table=document.createElement('table');const tr=document.createElement('tr');['優','上','中','下','劣'].forEach(t=>{const th=document.createElement('th');th.textContent=t;tr.append(th)});const row=document.createElement('tr');r.levels.forEach(vals=>{const td=document.createElement('td');td.textContent=vals.join('／');row.append(td)});table.append(tr,row);box.append(table);const criteria=document.createElement('div');r.criteria.forEach((detail,j)=>{const p=document.createElement('p');p.style.cssText='font-size:13px;line-height:1.55;margin:8px 0';const strong=document.createElement('strong');strong.textContent=['優','上','中','下','劣'][j]+'：';p.append(strong,document.createTextNode(detail));criteria.append(p)});box.append(criteria);scores.append(box);});}\nlet showScoreWarnings=false;function validateScores(){let ok=true;rubrics.forEach((r,i)=>{const el=document.getElementById('score'+i),error=document.getElementById('scoreError'+i);const raw=el.value.trim();const allowed=r.levels.flat();const valid=raw!==''&&allowed.some(n=>n===Number(raw));el.classList.toggle('invalid',showScoreWarnings&&!valid);el.setAttribute('aria-invalid',String(showScoreWarnings&&!valid));error.hidden=valid||!showScoreWarnings;error.textContent=valid?'':raw?'分數異常，請重新選擇':'請選擇自評分數';if(!valid)ok=false});return ok}\ndocument.querySelector('#scores').addEventListener('change',()=>{showScoreWarnings=true;validateScores();recalc();dirty=true});\nfunction total(){return rubrics.reduce((sum,r,i)=>{const raw=document.getElementById('score'+i).value.trim();if(raw==='')return sum;const value=Number(raw);return r.levels.flat().some(n=>n===value)?sum+value:sum},0)}\nfunction recalc(){const t=total();const filled=rubrics.filter((r,i)=>r.levels.flat().includes(Number(document.getElementById('score'+i).value))&&document.getElementById('score'+i).value!=='').length;document.querySelector('#scoreProgress').textContent='已完成 '+filled+'／'+rubrics.length+' 題';document.querySelector('#scoreCompletion').textContent=filled===rubrics.length?'✓ 自評已完成':'自評尚未完成';document.querySelector('#sum').textContent=String(t);const custom=document.querySelector('#override').checked;document.querySelector('#manualBox').hidden=!custom;document.querySelector('#effective').textContent=custom?document.querySelector('#manual').value||'尚未填寫':String(t)}\nfunction snapshot(){const data={};fields.forEach(id=>{const el=document.getElementById(id);if(el)data[id]=el.value});rubrics.forEach((_,i)=>data['score'+i]=document.getElementById('score'+i).value);data.override=document.querySelector('#override').checked;return data}\nfunction restore(data){if(!data||typeof data!=='object')return;fields.forEach(id=>{const el=document.getElementById(id);if(el)el.value=typeof data[id]==='string'?data[id]:''});rubrics.forEach((_,i)=>{const el=document.getElementById('score'+i);el.value=typeof data['score'+i]==='string'?data['score'+i]:''});document.querySelector('#override').checked=data.override===true;validateScores();recalc()}\nconst keyForRole=()=> 'employee-self-review-demo-v6-'+role.value;\nlet dirty=false,loading=false;\nconst status=document.querySelector('#status'),draftInfo=document.querySelector('#draftInfo');\nfunction readDraft(){try{const raw=window.HRGoogleCache.getItem(keyForRole());return raw?JSON.parse(raw):null}catch(e){status.textContent='讀取暫存失敗，請確認瀏覽器是否允許本機儲存';return null}}\nfunction updateDraftInfo(){const saved=readDraft();draftInfo.textContent=saved&&saved.savedAt?'此類別上次暫存：'+new Date(saved.savedAt).toLocaleString('zh-TW')+'（僅限目前瀏覽器）':'此類別尚無暫存草稿'}\nfunction clearForm(){fields.forEach(id=>document.getElementById(id).value='');rubrics.forEach((_,i)=>document.getElementById('score'+i).value='');showScoreWarnings=false;document.querySelectorAll('.required-error').forEach(el=>el.classList.remove('required-error'));document.querySelectorAll('.field-error').forEach(el=>el.hidden=true);document.getElementById('checkStatus').textContent='';document.querySelector('#override').checked=false;recalc()}\nfunction loadDraft(){const saved=readDraft();if(!saved){status.textContent='這個類別目前沒有已儲存的草稿';return}if(dirty&&!confirm('恢復草稿會覆蓋目前尚未暫存的內容，確定嗎？'))return;loading=true;clearForm();restore(saved.data);loading=false;dirty=false;status.textContent='已恢復上次暫存的面談、工作成果與自評分數；簽名請重新操作。'}\nfunction setRole(next){rubrics=next==='supervisor'?supervisorRubrics:staffRubrics;showScoreWarnings=false;renderScores();validateScores();recalc()}\ndocument.querySelectorAll('input,textarea').forEach(el=>el.addEventListener('input',()=>{recalc();if(!loading)dirty=true;el.classList.remove('required-error');const hint=document.getElementById('required-'+el.id);if(hint)hint.hidden=true}));\ndocument.querySelector('#override').addEventListener('change',()=>{recalc();dirty=true});\nrole.addEventListener('change',()=>{loading=true;clearForm();setRole(role.value);loading=false;dirty=false;updateDraftInfo();status.textContent='已切換考績類別；按「恢復已存草稿」才會載入此類別資料。'});\nsetRole(role.value);updateDraftInfo();\nif(readDraft())status.textContent='偵測到這個類別有暫存草稿，請按「恢復已存草稿」繼續填寫。';\ndocument.querySelector('#resume').addEventListener('click',loadDraft);document.querySelector('#check').addEventListener('click',()=>{let first=null;for(const id of fields.filter(x=>x!=='manual'&&x!=='reason')){const el=document.getElementById(id);if(!el)continue;const missing=!el.value.trim();el.classList.toggle('required-error',missing);let hint=document.getElementById('required-'+id);if(!hint){hint=document.createElement('p');hint.id='required-'+id;hint.className='field-error';el.insertAdjacentElement('afterend',hint)}hint.textContent=missing?'此欄位為必填，請填寫內容':'';hint.hidden=!missing;if(missing&&!first)first=el}showScoreWarnings=true;validateScores();for(let i=0;i\u003crubrics.length;i++){const el=document.getElementById('score'+i);if(!el.value&&!first)first=el}if(document.querySelector('#override').checked){for(const id of ['manual','reason']){const el=document.getElementById(id);const bad=!el.value.trim()||(id==='manual'&&(+el.value\u003c0||+el.value>100));el.classList.toggle('required-error',bad);if(bad&&!first)first=el}}const msg=document.getElementById('checkStatus');msg.textContent=first?'尚有必填欄位未完成，請查看紅框提示。':'\\u586b\\u5beb\\u5b8c\\u6574\\uff0c\\u53ef\\u78ba\\u8a8d\\u9001\\u51fa';if(first)first.focus();});\ndocument.querySelector('#save').addEventListener('click',()=>{try{const record={savedAt:new Date().toISOString(),data:snapshot()};window.HRGoogleCache.setItem(keyForRole(),JSON.stringify(record));dirty=false;updateDraftInfo();status.textContent='✓ 已暫存面談、工作成果及自評分數（不含簽名）。僅存於這台裝置的此瀏覽器。'}catch(e){status.textContent='暫存失敗，請勿關閉頁面。'}});\ndocument.querySelector('#reset').addEventListener('click',()=>{if(!confirm('確定刪除目前類別的本機草稿並清空畫面？此操作無法復原。'))return;try{window.HRGoogleCache.removeItem(keyForRole())}catch(e){}loading=true;clearForm();loading=false;dirty=false;updateDraftInfo();status.textContent='已清除這個類別的本機草稿。'});\nwindow.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});\nrecalc();\n\n// HR period state preview only. No real access or submission enforcement.\n(()=>{const mode=document.getElementById('previewMode'),target=document.getElementById('previewState');function render(){let data={periodStatus:'draft',start:'2026/11/01',end:'2026/11/3 :#92400e;padding:5px 10px;border-radius:7px;font-size:13px;font-weight:700;margin-bottom:8px}.rubric-desc{font-size:13px;color:#475467;margin:6px 0 10px}.rubric table{width:100%;border-collapse:collapse;font-size:13px}.rubric th,.rubric td{border:1px solid #e2e8f0;padding:7px 5px;text-align:center}.rubric th{background:#f8fafc}.rubric small{color:#667085}.signature-pad{width:100%;height:170px;border:2px dashed #94a3b8;border-radius:10px;background:#fff;touch-action:none;display:block}.signature-pad.confirmed{border:2px solid #16a34a;background:#f0fdf4}.signature-controls{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.signature-state{font-size:13px;color:#475467;margin-top:8px}#checkStatus{font-size:13px;font-weight:700}.required-error{border:2px solid #dc2626!important;background:#fff7f7!important}.field-error{font-size:12px;color:#b91c1c;font-weight:700;margin:4px 0}.warning{background:#fff7e6;border:1px solid #f4d398;border-radius:9px;padding:12px;font-size:13px}\n\n/* Single-site HR demo shell; NOT an authentication boundary. */\n.admin-nav #showEmployees{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd;font-weight:700}.admin-nav #showAccounts{background:#dcfce7;color:#166534;border:1px solid #86efac;font-weight:700}.admin-nav #showReviews{background:#f3e8ff;color:#7e22ce;border:1px solid #d8b4fe;font-weight:700}.admin-nav #showMultiSite{background:#ffedd5;color:#9a3412;border:1px solid #fdba74;font-weight:700}.admin-nav #showAcceptance{background:#e0f2fe;color:#075985;border:1px solid #7dd3fc;font-weight:700}.admin-nav button.active{outline:2px solid currentColor;outline-offset:1px}\n.period-preview{margin:0 0 14px;border:1px solid #d5ddea;background:#f8fafc;padding:12px;border-radius:10px;font-size:13px}.period-preview strong{display:block;margin-bottom:6px}.period-preview .preview-note{margin-top:8px;color:#667085}.period-preview .preview-state{font-weight:700;margin:8px 0}.period-preview select{max-width:250px;padding:7px;font-size:13px}\n\n.admin-nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:1px solid #e5e9f0}.admin-nav button{font-size:13px;padding:9px 12px}.admin-nav .hint{margin-left:auto}.admin-frame{height:calc(100vh - 120px)}\n.site-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.site-header h1{margin-top:0}.admin-entry{white-space:nowrap;background:#e9eef5;color:#243347;font-size:13px;padding:9px 12px}.admin-shell[hidden]{display:none!important}.admin-shell{position:fixed;inset:0;background:#f5f7fb;z-index:30;overflow:auto}.admin-top{position:sticky;top:0;z-index:1;background:#fff;border-bottom:1px solid #e5e9f0;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.admin-top strong{font-size:16px}.admin-top button{padding:8px 12px;font-size:13px}.admin-intro{max-width:900px;margin:22px auto;padding:0 18px}.admin-intro .warning{margin:12px 0}.admin-actions{display:flex;gap:10px;flex-wrap:wrap}.admin-frame{display:block;width:100%;height:calc(100vh - 65px);border:0;background:#f5f7fb}.admin-login{max-width:470px;margin:45px auto;background:white;border:1px solid #e5e9f0;border-radius:14px;padding:24px}.admin-login h2{margin-top:0}.admin-login p{line-height:1.65}.admin-login button{width:100%}@media(max-width:600px){.site-header{flex-wrap:wrap}.admin-entry{margin-left:auto}.admin-login{margin:20px 12px}}\n\n.brand-lockup{display:flex;align-items:center;gap:14px}.company-logo{object-fit:contain;flex:none;background:transparent;max-width:58px;height:auto}.company-logo[hidden]{display:none!important}@media(max-width:600px){.company-logo{max-width:44px}.brand-lockup{gap:10px}}\n/* Unified visual refresh: calm navy + teal, readable forms and consistent surfaces. */\n:root{--brand:#174b59;--brand-dark:#103946;--teal:#0d766d;--ink:#213544;--muted:#617485;--line:#dbe6e9;--canvas:#f2f7f7;--focus:#b9e5de}\nbody{background:var(--canvas);color:var(--ink);line-height:1.65}\nmain{max-width:1120px;padding:30px 24px 76px}\nh1{font-size:clamp(23px,2.2vw,29px);letter-spacing:.02em;color:var(--brand-dark);font-weight:800}\nh2{color:var(--brand-dark);font-weight:750;letter-spacing:.015em}\n.card,.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 20px rgba(22,69,78,.045);padding:24px;margin-top:18px}\n.card h2,.panel h2{padding-bottom:12px;border-bottom:1px solid #edf2f3;margin-bottom:17px}\n.muted,.hint,.small{color:var(--muted)}\ninput,select,textarea{border:1px solid #cbdadd;border-radius:9px;background:#fff;color:var(--ink);min-height:42px}\ninput:focus,select:focus,textarea:focus{outline:3px solid var(--focus);outline-offset:0;border-color:var(--teal)}\nbutton{background:var(--brand);border-radius:9px;font-weight:650;transition:background .15s,transform .15s}\nbutton:hover:not(:disabled){background:var(--brand-dark)}\nbutton.secondary{background:#eaf2f3;color:var(--brand-dark)}\nbutton.secondary:hover:not(:disabled){background:#dcebec}\nbutton:focus-visible,a:focus-visible{outline:3px solid #56c7b5;outline-offset:3px}\nth{background:#f0f6f6;color:#35535c;font-weight:750}\ntd,th{border-bottom-color:#e7eeee}\ntable tbody tr:hover{background:#f7fbfa}\n.warning,.warn,.banner{background:#fff9ed;border:1px solid #efdfb9;color:#705729;border-radius:12px}\n.actions{gap:10px}\n@media(max-width:720px){main{padding:18px 13px 50px}.card,.panel{padding:17px;border-radius:13px}h1{font-size:23px}}\n\n\nmain{max-width:880px}\n.site-header{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px 0 16px;border-bottom:2px solid #d8e8e8}\n.site-header h1{margin:0 0 4px}.site-header .hint{margin:0}\n.admin-entry{background:#e7f2f1!important;color:#13594f!important;border:1px solid #b8dad3!important}\n.admin-top{background:#fff;border-bottom:1px solid var(--line)}\n.admin-nav{background:#fff!important;gap:10px!important;padding:15px 22px!important;border-bottom:1px solid var(--line)!important}\n.admin-nav button{background:#f2f6f7!important;color:#31535b!important;border:1px solid #dbe8e9!important;border-radius:10px!important}\n.admin-nav button.active{background:#dcefeb!important;color:#075d55!important;outline:2px solid #9dcfc5!important}\n.admin-nav button:hover{background:#e6f2f0!important}\n.period-preview{border-color:#c9dfe0;background:#f4faf9}\n.rubric{border-color:#dce7e9;border-radius:12px;background:#fff}\n.rubric-head input,.rubric-head select{border-color:#c58b32;background:#fff9eb}\n.score-focus{background:#fff3d8;color:#845514}\n@media(max-width:720px){.site-header{align-items:flex-start;flex-direction:column}.admin-nav{padding:12px!important}}\n\n\n.employee-footer{display:flex;justify-content:center;padding:26px 12px 12px;border-top:1px solid #dbe6e9;margin-top:28px}.employee-footer .admin-entry{background:transparent!important;border:0!important;color:#72848b!important;font-size:12px!important;font-weight:500;padding:7px 10px}.employee-footer .admin-entry:hover{color:#174b59!important;text-decoration:underline;background:transparent!important}\n\n/* Keep HR title and all six tabs visible while scrolling the admin shell */\n.admin-top{position:sticky!important;top:0!important;z-index:12!important;background:#fff!important}.admin-nav{position:sticky!important;top:58px!important;z-index:11!important;background:#fff!important;box-shadow:0 3px 10px rgba(20,55,62,.06)}#adminDemo{display:contents}#adminDemo[hidden]{display:none!important}.admin-frame{height:calc(100vh - 180px)!important;min-height:500px;overflow:auto}@media(max-width:700px){.admin-nav{top:58px!important;overflow-x:auto;flex-wrap:nowrap!important}.admin-nav button{white-space:nowrap}.admin-nav .hint{display:none}.admin-frame{height:calc(100vh - 160px)!important;min-height:350px}}\n\n/* Login preview is intentionally disabled until server-side authentication exists */\n.login-preview{padding:15px 0 8px}.login-preview label{margin-top:10px}.login-preview input{background:#f2f5f6;color:#71818a}.login-preview button{width:100%;margin-top:14px;opacity:.55;cursor:not-allowed}.demo-divider{text-align:center;border-top:1px solid #dce5e7;margin:20px 0 12px;padding-top:12px;color:#667b82;font-size:12px}\n\u003c/style>\u003c/head>\n\u003cbody>\u003cmain>\n\u003cheader class=\"site-header\">\u003cdiv class=\"brand-lockup\">\u003cimg class=\"company-logo\" src=\"assets/yuhtong-logo-transparent.png\" alt=\"鈺通營造公司 LOGO\" width=\"58\" height=\"65\">\u003cdiv>\u003ch1>員工面談暨考績自評\u003c/h1>\u003cp class=\"hint\">員工面談與考績管理｜尚未連接公司員工名單或後端，請勿填寫真實個資\u003c/p>\u003c/div>\u003c/header>\n\u003csection id=\"identityDemo\" hidden>\u003cform id=\"identityDemoForm\">\u003c/form>\u003c/section>\n\u003cdiv class=\"warning\">草稿會儲存至系統；送出前請再次確認內容。\u003c/div>\u003caside class=\"period-preview\" aria-label=\"員工端開放狀態預覽\" hidden>\u003clabel for=\"previewMode\">預覽情境\u003c/label>\u003cselect id=\"previewMode\">\u003coption value=\"saved\">依人事後台設定\u003c/option>\u003coption value=\"draft\">尚未開放\u003c/option>\u003coption value=\"open\">開放填寫\u003c/option>\u003coption value=\"closed\">已截止／關閉\u003c/option>\u003coption value=\"submitted\">員工已送出\u003c/option>\u003c/select>\u003cdiv id=\"previewState\" class=\"preview-state\" role=\"status\">\u003c/div>\u003cdiv class=\"preview-note\">正式版才會由伺服器判斷是否可填寫。此處不代表員工已登入、送出或取得考績資料。\u003c/div>\u003c/aside>\n\u003csection class=\"card\">\u003ch2>一、基本資料\u003c/h2>\u003cdiv>\u003clabel for=\"role\">考績表類別\u003c/label>\u003cselect id=\"role\">\u003coption value=\"staff\">一般職員\u003c/option>\u003coption value=\"supervisor\">主管人員\u003c/option>\u003c/select>\u003cp class=\"hint\">依員工資料自動帶入。\u003c/p>\u003c/div>\u003cdiv class=\"grid\">\u003cdiv>\u003clabel for=\"name\">姓名\u003c/label>\u003cinput id=\"name\" autocomplete=\"off\" placeholder=\"\">\u003c/div>\u003cdiv>\u003clabel for=\"department\">部門\u003c/label>\u003cinput id=\"department\" placeholder=\"待後端自動帶入\" readonly>\u003c/div>\u003c/div>\u003cp class=\"hint\">正式版輸入姓名後才由後端查詢；同名需再核對，不向瀏覽器提供整份名單。\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003ch2>二、員工面談\u003c/h2>\u003cdiv id=\"interview\">\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>三、工作成果\u003c/h2>\u003cp class=\"hint\">依 Word 原表格逐項填寫，共 4 項。成果可說明進度、品質、效率、成本節省、風險控管、流程改善或其他具體貢獻。\u003c/p>\u003cdiv id=\"projectRows\">\u003c/div>\u003c/section>\n\u003csection class=\"card\">\u003ch2>四、考績自評\u003c/h2>\u003cp class=\"hint\">依所選類別顯示原始 Word 的八項考核標準、評語及分數。\u003c/p>\u003cdiv class=\"score-focus\">★ 請注意：每題「自評分數」請填在橘黃色欄位\u003c/div>\u003cdiv id=\"scores\">\u003c/div>\u003cp id=\"scoreProgress\" class=\"hint\">已完成 0／8 題\u003c/p>\u003cp>系統自動加總：\u003coutput id=\"sum\">0\u003c/output> 分\u003c/p>\u003clabel>\u003cinput id=\"override\" type=\"checkbox\" style=\"width:auto\"> 人工調整總分\u003c/label>\u003cdiv id=\"manualBox\" hidden>\u003clabel for=\"manual\">調整後分數\u003c/label>\u003cinput id=\"manual\" type=\"number\" min=\"0\" step=\"0.5\">\u003clabel for=\"reason\">調整原因\u003c/label>\u003ctextarea id=\"reason\">\u003c/textarea>\u003c/div>\u003cp>採用總分：\u003coutput id=\"effective\">0\u003c/output> 分\u003c/p>\u003cp id=\"scoreCompletion\" class=\"hint\">自評尚未完成\u003c/p>\u003cdiv id=\"submissionReceipt\" class=\"submission-receipt\" role=\"status\">\u003c/div>\u003cp class=\"hint\" id=\"confirmationMeaning\">\u003c/p>\u003c/section>\n\u003csection class=\"card\">\u003cdiv class=\"actions\">\u003cbutton id=\"save\" type=\"button\">暫存草稿\u003c/button>\u003cbutton id=\"resume\" class=\"secondary\" type=\"button\">恢復已存草稿\u003c/button>\u003cbutton id=\"reset\" class=\"secondary\" type=\"button\">清除本機草稿\u003c/button>\u003cbutton id=\"check\" class=\"secondary\" type=\"button\">檢查填寫完整性\u003c/button>\u003cbutton id=\"submit\" class=\"secondary\" type=\"button\" disabled>正式送出（尚未開放）\u003c/button>\u003c/div>\u003cp id=\"checkStatus\" role=\"status\">\u003c/p>\u003cp id=\"draftInfo\" class=\"hint\">尚無暫存紀錄\u003c/p>\u003cp id=\"status\" class=\"hint\" role=\"status\">\u003c/p>\u003c/section>\n\u003cfooter class=\"employee-footer\">\u003cbutton type=\"button\" class=\"admin-entry\" id=\"openAdmin\">管理後台入口\u003c/button>\u003c/footer>\n\u003c/main>\n\u003cdiv id=\"adminShell\" class=\"admin-shell\" hidden>\n\u003cdiv class=\"admin-top\">\u003cstrong>鈺通營造｜人事管理後台\u003c/strong>\u003cbutton type=\"button\" class=\"secondary\" id=\"exitAdmin\">← 返回員工填寫頁\u003c/button>\u003c/div>\n\u003cdiv id=\"adminLogin\" class=\"admin-login\">\u003ch2>人事後台入口\u003c/h2>\u003cp class=\"warning\">\u003c/p>\u003cp class=\"hint\">依目前公司 POP/SMTP Outlook 信箱環境，先預覽「公司信箱＋一次性驗證碼」登入流程；正式寄信與驗證服務尚未建立。\u003c/p>\u003cdiv class=\"login-preview\" aria-label=\"公司信箱一次性驗證碼登入流程預覽\">\u003clabel for=\"previewAdminEmail\">公司 Outlook 信箱\u003c/label>\u003cinput id=\"previewAdminEmail\" type=\"email\" placeholder=\"正式版啟用後填寫\" disabled autocomplete=\"off\">\u003cbutton type=\"button\" disabled title=\"尚未串接寄信與身分驗證服務\">寄送一次性驗證碼（尚未啟用）\u003c/button>\u003clabel for=\"previewAdminCode\">電子郵件驗證碼\u003c/label>\u003cinput id=\"previewAdminCode\" inputmode=\"numeric\" type=\"text\" placeholder=\"正式版啟用後填寫\" disabled autocomplete=\"off\">\u003cbutton type=\"button\" disabled title=\"尚未建立伺服端驗證與權限檢查\">驗證並登入（尚未啟用）\u003c/button>\u003cp class=\"hint\">正式版規劃：驗證碼限時、限次數且僅能使用一次；驗證通過後，系統仍會檢查是否為已授權的人事帳號。此頁目前不寄信、不驗證，也不收集任何帳號資料。\u003c/p>\u003c/div>\u003cbutton type=\"button\" id=\"enterDemoAdmin\">進入人事後台\u003c/button>\u003c/div>\n\u003cdiv id=\"adminDemo\" hidden>\u003cnav class=\"admin-nav\" aria-label=\"人事後台功能\">\u003cbutton type=\"button\" class=\"secondary\" id=\"showEmployees\">員工資料管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showAccounts\">帳號與權限管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showReviews\">考績年度／資料查詢\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showMultiSite\">多工地評核管理\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showAcceptance\">人事流程試行\u003c/button>\u003cbutton type=\"button\" class=\"secondary\" id=\"showMaintenance\">系統維護中心\u003c/button>\u003cspan class=\"hint\">正式收件、Word 下載及後端權限：尚未串接\u003c/span>\u003c/nav>\u003ciframe id=\"adminFrame\" class=\"admin-frame\" title=\"人事後台功能頁面\" loading=\"lazy\">\u003c/iframe>\u003c/div>\n\u003c/div>\n\u003cscript src=\"inline-integrated-demo-1.js\">\u003c/script>\n\u003c!-- Original form preserved verbatim above; mock workflow is an additive adapter. -->\n\u003cscript src=\"original-form-schema.js\">\u003c/script>\n\u003cscript src=\"integrated-demo.js\">\u003c/script>\n\u003cscript src=\"original-form-workflow.js\">\u003c/script>\n\u003cscript src=\"/employee-interview-system/offline/credentials-ui.js\">\u003c/script>\u003cscript src=\"/employee-interview-system/local/management.js\">\u003c/script>\u003c/body>\u003c/html>\n","prototype/integrated-demo.js":"/* Standalone fake-data workflow. Not a security boundary or real backend. */\n(function(root){\n'use strict';\nconst originalForm=typeof module!=='undefined'&&module.exports?require('./original-form-schema.js'):root.HROriginalForm;\nconst KEY='hr-integrated-demo-v1';\nconst states={draft:'員工草稿','self-submitted':'員工已送出','review-draft':'主管草稿','review-submitted':'主管已送出',closed:'已結案'};\nconst allowed={employee:['self'],supervisor:['supervisor'],hr:['hr']};\nconst employees=[{id:'__PENDING__',name:'',department:'',site:'',supervisor:''}];\nconst fresh=(period)=>({period,employeeId:'',employeeName:'',department:'',status:'draft',interview:'',results:'',selfScore:null,reviewScore:null,reviewComment:'',updatedAt:null});\nfunction validScore(v){return (typeof v==='number'||typeof v==='string') && String(v).trim()!=='' && v!==null && Number.isFinite(Number(v)) && Number(v)*2%1===0 && Number(v)>=0 && Number(v)\u003c=100}\nfunction transition(r,action,values){\n const n={...r},v=values||{};\n if(action==='save-self'||action==='submit-self'){\n   if(r.status!=='draft')throw Error('員工自評已送出，不可再修改');\n   if(action==='submit-self'&&v.formData){const adopted=originalForm.validateOriginalForm(v.formData,v.formRole,v.signatureImage,v.signatureConfirmed);if(adopted!==Number(v.selfScore))throw Error('採用總分不一致')}\n   if(action==='submit-self'&&!v.formData&&v.scores){const scores=Object.values(v.scores);if(scores.length!==8||scores.some(x=>String(x).trim()===''||!validScore(x))||scores.reduce((a,x)=>a+Number(x),0)!==Number(v.selfScore)||!String(v.signature||'').trim())throw Error('請完成逐項評分、總分與簽名')}\n   if(action==='submit-self'&&(!String(v.interview||'').trim()||!String(v.results||'').trim()||!validScore(v.selfScore)))throw Error('請填妥面談、工作成果及 0～100 分自評');\n   if(v.selfScore!==''&&v.selfScore!==null&&!validScore(v.selfScore))throw Error('自評分數必須為 0～100，以 0.5 分為單位');\n   Object.assign(n,{interview:String(v.interview||''),results:String(v.results||''),signature:String(v.signature||''),signatureImage:String(v.signatureImage||''),scores:v.scores||{},selfScore:v.selfScore===''||v.selfScore===null?null:Number(v.selfScore)});\n   if(v.formData){\n    n.formData=JSON.parse(JSON.stringify(v.formData));n.formRole=v.formRole;\n    n.signatureConfirmed=v.signatureConfirmed===true;\n    n.draftForms={...(r.draftForms||{}),[v.formRole]:{data:n.formData,signatureImage:n.signatureImage,savedAt:new Date().toISOString()}};\n    if(!r.formData&&(r.interview||r.results))n.legacySelf=r.legacySelf||{interview:r.interview,results:r.results,selfScore:r.selfScore,scores:r.scores,signature:r.signature,signatureImage:r.signatureImage};\n   }\n   n.status=action==='submit-self'?'self-submitted':'draft';\n }else if(action==='save-review'||action==='submit-review'){\n   if(!['self-submitted','review-draft'].includes(r.status))throw Error('目前不可編輯主管評核');\n   if(action==='submit-review'&&(!validScore(v.reviewScore)||!String(v.reviewComment||'').trim()))throw Error('請填寫 0～100 分主管評分及評語');\n   if(v.reviewScore!==''&&v.reviewScore!==null&&!validScore(v.reviewScore))throw Error('主管評分必須為 0～100，以 0.5 分為單位');\n   Object.assign(n,{reviewScore:v.reviewScore===''||v.reviewScore===null?null:Number(v.reviewScore),reviewComment:String(v.reviewComment||'')});\n   n.status=action==='submit-review'?'review-submitted':'review-draft';\n }else if(action==='close'){\n   if(r.status!=='review-submitted')throw Error('主管尚未完成評核');\n   n.status='closed';\n }else throw Error('未知操作');\n n.updatedAt=new Date().toISOString();\n return n;\n}\nfunction createStore(storage){\n const read=()=>{try{const d=JSON.parse(storage.getItem(KEY)||'{}');return d&&typeof d==='object'&&!Array.isArray(d)?d:{}}catch(e){return {}}};\n const get=(p,id='__PENDING__')=>{const d=read(),e=employees.find(e=>e.id===id);if(!e)throw Error('查無此員工');const k=id==='__PENDING__'?p:p+':'+id;return d[k]&&d[k].period===p?{...d[k],employeeName:e.name,department:e.department,site:e.site,supervisor:e.supervisor}:{...fresh(p),employeeId:id,employeeName:e.name,department:e.department,site:e.site,supervisor:e.supervisor}};\n const save=(p,r)=>{const d=read();d[r.employeeId==='__PENDING__'?p:p+':'+r.employeeId]=r;storage.setItem(KEY,JSON.stringify(d));return r};\n const reset=()=>storage.removeItem(KEY);\n return {get,save,reset};\n}\nconst api={transition,createStore,fresh,validScore,states,allowed,employees,validateOriginalForm:originalForm.validateOriginalForm};\nif(typeof module!=='undefined'&&module.exports)module.exports=api;\nif(root)root.HRDemo=api;\n})(typeof window!=='undefined'?window:null);\n","prototype/original-form-schema.js":"/* Generated exclusively from the approved DOCX files. Run tools/build_word_manifest.py. */\n(function(root){\n'use strict';\nconst rubrics={\"staff\": [{\"name\": \"工作改進績效\", \"sourceName\": \"工進作績改效\", \"desc\": \"指為達工作目標或解決問題所做思考及改進績效程度。\", \"criteria\": [\"具有問題意識，對本身業務能積極改進，著有成效。\", \"經常提出建議，實施結果成效良好。\", \"能就本身工作加以改進，或提出建議尚有成效。\", \"缺乏問題意識，尚能接受他人的建議，而改進本身工作。\", \"固步自封、滿足現狀、不願改進本身工作。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"知識與技能\", \"sourceName\": \"知識技與能\", \"desc\": \"指完成職務所必需的基本知識、專門知識和技能熟練的程度。\", \"criteria\": [\"有豐富的學識和技能，順利完成本身工作。\", \"學識和技能尚可，足夠完成本身工作。\", \"知識和技能為一般水準，尚能完成本身工作。\", \"知識和技能稍感不足，執行職務需詳細提示。\", \"知識和技能均不足，日常工作不能圓滿達成。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"操行與品德\", \"sourceName\": \"操行品與德\", \"desc\": \"指其工作態度、遵守規律、時間觀念、成本觀念修養、禮貌等。\", \"criteria\": [\"工作認真、態度誠懇、操行與品德為他人之模範。\", \"工作認真、態度良好、穩健、有禮貌、能受他人之尊敬。\", \"態度、品行尚可，能獲得他人好感。\", \"態度、品行、守法觀念稍差，須加督導。\", \"守法觀念淡薄、徇私誤事，態度、品行均差。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"與人協調情形\", \"sourceName\": \"與調人情協形\", \"desc\": \"指對上司的服從與同事的協調及協助他人的程度。\", \"criteria\": [\"絕對聽從指示命令，自動與人協調，人群關係圓滑。\", \"聽從指示命令，與人合作，人群關係良好。\", \"服從性、協調性、人群關係尚稱良好。\", \"服從性、協調性稍差，不願協助他人，人群關係稍差。\", \"不聽從指示命令，我行我素，缺乏合作精神，人群關係差。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"工作意欲程度\", \"sourceName\": \"工欲作程意度\", \"desc\": \"指對工作的熱誠自動自發的精神、研究心及不怕困難的氣魄。\", \"criteria\": [\"極有工作熱誠，精益求精，經常進修，富有上進心。\", \"對工作具有興趣及積極性，且能認真執行，力求上進。\", \"圓滿達成本身工作，工作意欲尚稱良好。\", \"工作意欲稍差，偶而偷懶、逃避困難工作之傾向，缺乏向上心。\", \"意志消沈、陽奉陰違，毫無工作欲。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"貫徹命令程度\", \"sourceName\": \"貫令徹程命度\", \"desc\": \"指完成工作責任及貫徹指示命令的努力程度。\", \"criteria\": [\"強烈責任感，認識本身工作的重要性，適切適時完成工作。\", \"富有責任感，認識本身工作職責，完成指派的工作。\", \"有責任感、貫徹命令與工作努力程度尚可。\", \"責任感稍差，常不能貫徹指示命令，時有逃避責任之事情。\", \"無責任感，時常半途而廢，掩飾虛報，不能放心交辦工作。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"工作效率情形\", \"sourceName\": \"工率作情效形\", \"desc\": \"指在一定的時間內完成預定工作的量和速度。\", \"criteria\": [\"工作效率超群，指派工作均能在預定時間內適切完成，並加覆核。\", \"工作效率高，能在預定時間內完成工作並加覆核。\", \"工作效率為一般水準，能在預定時間內完成工作。\", \"工作效率稍差，有時未能在預定時間內完成工作，須加催促。\", \"工作效率差，雖加催促亦不能在預定時間內完成工作。\"], \"levels\": [[18.0, 19.0, 20.0], [15.0, 16.0, 17.0], [12.0, 13.0, 14.0], [9.0, 10.0, 11.0], [6.0, 7.0, 8.0]]}, {\"name\": \"工作精確程度\", \"sourceName\": \"工確作程精度\", \"desc\": \"指工作有無錯誤，是否細心？就工作成果之良好及正確性的程度加以考核。\", \"criteria\": [\"工作處理經過與結束極具安定性與正確性，能充分信賴。\", \"工作細心，成果正確，能信賴。\", \"偶而會發生錯誤，但工作成果尚稱良好。\", \"時常發生錯誤，工作成果稍差。\", \"雖加督導，工作成果仍差，粗心大意，浪費多。\"], \"levels\": [[18.0, 19.0, 20.0], [15.0, 16.0, 17.0], [12.0, 13.0, 14.0], [9.0, 10.0, 11.0], [6.0, 7.0, 8.0]]}], \"supervisor\": [{\"name\": \"組織領導成果\", \"sourceName\": \"組導織成領果\", \"desc\": \"指運用管理能力統轄部屬，包括工作的分配、教導與啟發所做努力的程度。\", \"criteria\": [\"管理良好，領導有方獲得全體部屬之心服，組織內士氣高昂、規律好。\", \"管理熱心，部屬心服、士氣高昂、規律好。\", \"管理認真，組織內士氣、規律尚稱良好。\", \"對管理不太關心，組織內士氣稍差，部屬有違規現象。\", \"管理懈怠、引起部屬不滿，組織散漫、士氣低落、規律差。\"], \"levels\": [[18.0, 19.0, 20.0], [15.0, 16.0, 17.0], [12.0, 13.0, 14.0], [9.0, 10.0, 11.0], [6.0, 7.0, 8.0]]}, {\"name\": \"業務處理成果\", \"sourceName\": \"業理務成處果\", \"desc\": \"指所完成業務工作成果的正確性與可靠性之程度。\", \"criteria\": [\"實事求是，適切適時行事且能貫徹到底，成果極佳，能充分信賴。\", \"工作細心，適時行事，成果正確，堪能信賴。\", \"工作細心且能在預定時間內完成，成果尚稱良好。\", \"工作不夠細心，常有錯誤，成果稍差，須加催促。\", \"工作能力極弱，成果差，浪費多，須嚴加督導。\"], \"levels\": [[13.0, 14.0, 15.0], [10.0, 11.0, 12.0], [7.0, 8.0, 9.0], [5.5, 6.0, 6.5], [4.0, 4.5, 5.0]]}, {\"name\": \"革新改進績效\", \"sourceName\": \"革進新績改效\", \"desc\": \"指為達成工作目標或解決工作問題所做創造、思考及革新之績效程度。\", \"criteria\": [\"具有敏感的問題意識，積極謀求革新，著有成效。\", \"自動改進工作方法或提出建議，力求革新、提高效率，成效良好。\", \"能擬定工作改善方法或提出建議，成效普通。\", \"問題意識稍差，份內工作少有改進。\", \"滿足現狀、不謀改進、工作效率差。\"], \"levels\": [[13.0, 14.0, 15.0], [10.0, 11.0, 12.0], [7.0, 8.0, 9.0], [5.5, 6.0, 6.5], [4.0, 4.5, 5.0]]}, {\"name\": \"接洽表現情形\", \"sourceName\": \"接現洽情表形\", \"desc\": \"指內外接洽或商討事項所表現才能及風度。\", \"criteria\": [\"任何場合皆能貫徹正確主張，令人感服，圓滿達成目的。\", \"任何商討或接洽，都有正確主張，能達成目的。\", \"接拾或商討能力及風度均為一般水準，尚能達成目的。\", \"無主見亦不主張，接洽能力不足，需要他人協助。\", \"對答技巧差，態度欠溫和，給對方留不好的印象。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8.5], [6.0, 6.5, 7.0], [4.5, 5.0, 5.5], [3.0, 3.5, 4.0]]}, {\"name\": \"盡責努力程度\", \"sourceName\": \"\\\\盡力責程努度\", \"desc\": \"指完成業務職掌及承上啟下之努力程度。\", \"criteria\": [\"有強烈責任感，認真執行業務，任勞任怨完成工作。\", \"富有責任感，認識本身職責，認真執行業務。\", \"有責任感，執行業務努力程度尚稱良好。\", \"責任感稍差，時常有逃避責任的傾向。\", \"無責任感，常虛報或逃避責任，轉達命令不夠徹底。\"], \"levels\": [[9.0, 9.5, 10.0], [7.5, 8.0, 8. ||'').trim())throw Error('請完成原版調整分數及調整原因');sum=Number(data.manual)}\n return sum;\n}\nconst api={rubrics,questions};api.validateOriginalForm=validateOriginalForm;\nif(typeof module!=='undefined'&&module.exports)module.exports=api;\nif(root)root.HROriginalForm=api;\n})(typeof window!=='undefined'?window:null);\n","prototype/original-form-workflow.css":"/* Additions are scoped to the mock workflow; original form CSS is unchanged. */\n#workflowDialog{width:min(880px,calc(100vw - 26px));max-height:90vh;overflow:auto;border:1px solid #dce7e9;border-radius:16px;padding:24px;color:var(--ink);background:#fff}\n#workflowDialog::backdrop{background:rgba(22,53,65,.35)}\n#workflowDialog [hidden]{display:none!important}\n#workflowDialog .actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}\n#workflowDialog h2{margin-top:0}\n#workflowDialog p{white-space:pre-wrap;overflow-wrap:anywhere}\n#workflowDialog .workflow-table{overflow-x:auto;margin:16px 0}\n#workflowDialog table{min-width:720px;width:100%;border-collapse:collapse}\n#workflowDialog th,#workflowDialog td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}\n#workflowDialog td button{margin:3px;white-space:nowrap}\n#workflowDialog #reviewSignature{max-width:100%;width:360px}\n#workflowDialog #flowStatus{font-weight:650}\n#workflowState{font-size:12px;align-self:center}\n@media(max-width:600px){#workflowDialog{padding:17px}#workflowDialog .grid{grid-template-columns:1fr}#workflowState{max-width:120px}}\n\n/* Requested acceptance adjustments; retain logo, colors, fields and buttons. */\nmain{max-width:1280px}\nmain > .card{padding:26px}\nmain textarea{min-height:110px}\nmain label{margin-top:16px;margin-bottom:7px}\n#signatureOrientation{max-width:280px;margin-bottom:12px}\n#signatureCanvas[data-signature-layout=\"vertical\"]{width:160px;height:360px;max-width:100%;margin-inline:auto}\n#storedRecord{scroll-margin-top:100px}\n#workflowDialog{width:min(1480px,cal
